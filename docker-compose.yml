# Local MongoDB for development: `docker compose up -d`
# Matches MONGO_URI in BE/.env.example. Data survives restarts in the `mongo-data` volume.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
