# Local MongoDB for development: `docker compose up -d`
# Matches MONGO_URI in BE/.env.example. Data survives restarts in the `mongo-data` volume.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  # Run queue for code execution (DSE-22). Needed only with SANDBOX_API_URL set.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  mongo-data:
